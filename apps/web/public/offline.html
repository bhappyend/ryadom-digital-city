<html lang="ru">
<head>

  <title>Нет соединения — Рядом</title>
  <style>
    :root{color-scheme:dark;font:100%/1.6 system-ui,sans-serif;background:#061217;color:#f4f9fa}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
    main{width:min(100%,36rem)}.brand{color:#25f5b0;font-size:1.5rem;font-weight:800;margin:0 0 3rem}.brand span{display:block;font-size:.875rem;font-weight:400;color:#a1b5be}
    h1{font-size:clamp(1.8rem,6vw,2.75rem);line-height:1.2;margin:0 0 1.25rem}p{margin:0 0 1.5rem;color:#a1b5be}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border-radius:12px;background:#25f5b0;color:#061217;font-weight:700;text-decoration:none}
    a:focus-visible{outline:3px solid #f4f9fa;outline-offset:5px}small{display:block;font-size:.875rem;color:#a1b5be;margin-top:2rem}
  </style>
</head>
<body>
  <main>
    <p class="brand">Рядом<span>by Patchvale</span></p>
    <h1>Пока нет соединения</h1>
    <p>Проверьте подключение к интернету и попробуйте снова. Для поиска мест, просмотра карты и построения маршрутов нужен интернет.</p>
    <a href="/">Открыть главную</a>
    <small>Если соединение уже появилось, можно обновить эту страницу.</small>
  </main>
</body>
</html>
