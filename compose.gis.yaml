name: ryadom-gis
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted@sha256:ef30a71658c1b372d301153c35cf31fccaf90d817e7815d12200b6354fb4f805
    ports: ["127.0.0.1:8002:8002"]
    volumes:
      - ./infra/gis/runtime/valhalla:/custom_files
      - ./infra/gis/runtime/smolensk.osm.pbf:/custom_files/smolensk.osm.pbf:ro
    environment:
      server_threads: "1"
      build_admins: "False"
      build_time_zones: "False"
      build_elevation: "False"
      use_default_speeds_config: "False"
      build_transit: "False"
      build_tar: "True"
    mem_limit: 1400m
    cpus: 2
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8002/status >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 15m
    logging: {driver: local, options: {max-size: 5m, max-file: "2"}}
  nominatim:
    image: mediagis/nominatim@sha256:168c30e20fbba0c2e8199fca7a8aa2640e8cc1a62f8b05b1958897796fdb38f1
    profiles: [geocoder]
    ports: ["127.0.0.1:8088:8080"]
    volumes:
      - ./infra/gis/nominatim-start.sh:/app/ryadom-start.sh:ro
      - ./infra/gis/runtime/smolensk.osm.pbf:/data/smolensk.osm.pbf:ro
      - nominatim-db:/var/lib/postgresql/16/main
    command: [bash, /app/ryadom-start.sh]
    secrets: [nominatim_password]
    environment:
      PBF_PATH: /data/smolensk.osm.pbf
      THREADS: "1"
      GUNICORN_WORKERS: "1"
      UPDATE_MODE: none
      IMPORT_WIKIPEDIA: "false"
      IMPORT_SECONDARY_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      IMPORT_GB_POSTCODES: "false"
      IMPORT_TIGER_ADDRESSES: "false"
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_MAINTENANCE_WORK_MEM: 256MB
      POSTGRES_AUTOVACUUM_WORK_MEM: 64MB
      POSTGRES_WORK_MEM: 8MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 512MB
      POSTGRES_MAX_CONNECTIONS: "30"
      POSTGRES_SYNCHRONOUS_COMMIT: "on"
      NOMINATIM_SERVE_DEBUG_OUTPUT: "no"
    mem_limit: 1600m
    cpus: 2
    shm_size: 256m
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, "curl -fsS 'http://127.0.0.1:8080/status?format=json' >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30m
    logging: {driver: local, options: {max-size: 5m, max-file: "2"}}
  tiles:
    image: node@sha256:8ea2348b068a9544dae7317b4f3aafcdc032df1647bb7d768a05a5cad1a7683f
    profiles: [tiles]
    ports: ["127.0.0.1:8089:8080"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: ["./infra/gis:/data:ro"]
    command: [node, /data/tiles-server.mjs]
    mem_limit: 192m
    cpus: 1
    pids_limit: 32
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: {driver: local, options: {max-size: 5m, max-file: "2"}}
  tilemaker:
    image: ghcr.io/systemed/tilemaker@sha256:71f65be841445a69bae9bbb1fd30cd2809686d705d3f47682508f8a33851d51c
    profiles: [build]
    volumes:
      - ./infra/gis:/data
    entrypoint: [/bin/sh]
    command: [/data/tilemaker-build.sh]
    mem_limit: 1400m
    cpus: 2
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    logging: {driver: local, options: {max-size: 5m, max-file: "2"}}
volumes:
  nominatim-db:
secrets:
  nominatim_password:
    file: ./infra/gis/runtime/nominatim-password
